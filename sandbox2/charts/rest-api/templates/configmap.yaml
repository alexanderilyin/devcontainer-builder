apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rest-api.fullname" . }}-app
  labels:
    {{- include "rest-api.labels" . | nindent 4 }}
# .Files.Glob's AsConfig helper renders every matched file as a ConfigMap
# data entry keyed by its basename - adding a new .py file under files/ in
# a later phase needs no template change here.
data:
  {{- (.Files.Glob "files/*.py").AsConfig | nindent 2 }}
