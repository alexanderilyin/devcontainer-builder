name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/devcontainer-builder
      - run: helm template charts/devcontainer-builder

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/devcontainer-build
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init
      - run: terraform validate
      - run: terraform test

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sandbox2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --upgrade pip mkdocs-material
      - run: mkdocs build --strict
