site_name: sandbox2 BDD Harness
site_description: Real-command BDD testing for Helm, Kubernetes, and HTTP services.
site_url: https://alexanderilyin.github.io/devcontainer-builder/
repo_url: https://github.com/alexanderilyin/devcontainer-builder
repo_name: alexanderilyin/devcontainer-builder
edit_uri: edit/main/sandbox2/docs/

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Architecture: architecture.md
  - BDD conventions: bdd-conventions.md
  - Helm testing: helm-testing.md
  - Kubernetes testing: kubernetes-testing.md
  - REST testing: rest-testing.md
  - Fixtures and charts: fixtures.md
  - Development: development.md
  - Plans:
      - Phase 3 users and auth: claude/plans/0001-phase3-users-and-auth.md
      - Test coverage gaps: claude/plans/0002-test-coverage-gaps.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables

plugins:
  - search
