apiVersion: v2
name: test-git-server
description: >-
  Real git server test fixture serving seeded bare repos over both git://
  (git-daemon, unauthenticated) and smart HTTP (git-http-backend via
  Python's stdlib CGI handler - no webserver/fcgiwrap needed). No custom
  image build: off-the-shelf images plus an initContainer that seeds repos
  from a ConfigMap. Not a production chart. NOTE: the git-daemon and
  git-http containers install their own packages (apk/apt) at every pod
  startup rather than using a pre-built image with those packages baked
  in - see the "no custom image build" comment in templates/deployment.yaml
  for why, and the tradeoff it costs (a real, sometimes 10-30s+ window of
  transient readiness-probe "Unhealthy" events on every fresh pod start,
  which `helm --wait` correctly waits through rather than a real failure).
type: application
version: 0.1.0
appVersion: "1.0"
