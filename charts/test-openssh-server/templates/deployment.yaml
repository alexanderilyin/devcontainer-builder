apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "test-openssh-server.fullname" . }}
  labels:
    {{- include "test-openssh-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "test-openssh-server.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "test-openssh-server.labels" . | nindent 8 }}
    spec:
      containers:
        - name: openssh-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: ssh
              containerPort: 2222
          env:
            - name: PUID
              value: {{ .Values.puid | quote }}
            - name: PGID
              value: {{ .Values.pgid | quote }}
            - name: TZ
              value: {{ .Values.timezone | quote }}
            - name: LOG_STDOUT
              value: "true"
          volumeMounts:
            - name: config
              mountPath: /config
          readinessProbe:
            tcpSocket:
              port: ssh
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            tcpSocket:
              port: ssh
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        # emptyDir on purpose: this is a disposable test fixture, not a
        # long-lived server - the host key regenerating on every restart is
        # fine (nothing pins against a specific key across redeploys).
        - name: config
          emptyDir: {}
