replicaCount: 1

image:
  repository: ghcr.io/example/devcontainer-builder
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  port: 8080

buildkit:
  # e.g. tcp://buildkit-buildkit-service.buildkit.svc.cluster.local:1234
  endpoint: ""

registryAuth:
  # Provide either an existing Secret (must contain a `.dockerconfigjson` key,
  # same shape as a kubernetes.io/dockerconfigjson Secret) or an inline
  # docker config JSON string below.
  existingSecret: ""
  dockerConfigJson: ""

gitCredentials:
  # Server-side default git credentials, looked up by host when a request
  # doesn't supply its own gitCredentials. Provide either an existing Secret
  # (must contain a `git-credentials.json` key, same array shape as `entries`
  # below) or inline entries, which get rendered into a chart-managed Secret.
  existingSecret: ""
  entries: []
  # entries:
  #   - host: github.com
  #     kind: https
  #     username: svc-bot
  #     token: ghp_...
  #   - host: gitlab.internal.example.com
  #     kind: ssh
  #     privateKey: |
  #       -----BEGIN OPENSSH PRIVATE KEY-----
  #       ...
  #     pinnedHostKey: "gitlab.internal.example.com ssh-ed25519 AAAA..."

# tofu = trust-on-first-use via ssh-keyscan at clone time; pinned = require
# entries.[].pinnedHostKey for every SSH git credential (fails closed if
# missing for a host using SSH creds under this policy).
sshHostKeyPolicy: tofu

registryMapping:
  # Non-sensitive repo -> registry routing rules, used to resolve
  # image.registry when a request omits it. First matching rule wins, rules
  # are checked in the order given.
  rules: []
  # rules:
  #   - hostMatch: github.com
  #     pathPrefix: "org-a/"
  #     registry: ghcr.io/org-a

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

scratchVolume:
  sizeLimit: 5Gi
