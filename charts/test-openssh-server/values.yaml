replicaCount: 1

image:
  repository: lscr.io/linuxserver/openssh-server
  tag: latest
  pullPolicy: IfNotPresent

# No PUBLIC_KEY/PASSWORD_ACCESS configured on purpose - this fixture only
# needs to answer the SSH protocol's initial key exchange (what
# ssh-keyscan/host-key verification use), never an authenticated login.
puid: "1000"
pgid: "1000"
timezone: "Etc/UTC"

service:
  # 22 (the SSH default) rather than the container's own 2222, so clients
  # can connect with a plain ssh://host/path URL and no explicit port -
  # matching what a real git-over-ssh remote looks like.
  port: 22

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi
